name: Publish Docker Image

on:
  push:
    paths:
      - "release-versions/*"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the version
        id: vars
        run: echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (debian)
        run: |
          version="${{ steps.vars.outputs.tag }}"
          docker build --build-arg STRAPI_VERSION="$version" --build-arg NODE_VERSION=24 \
            -t "ghcr.io/rault-a/strapi:$version" -t "ghcr.io/rault-a/strapi:latest" \
            images/strapi-debian
          docker push "ghcr.io/rault-a/strapi:$version"
          docker push "ghcr.io/rault-a/strapi:latest"

      - name: Build and push (alpine)
        run: |
          version="${{ steps.vars.outputs.tag }}"
          docker build --build-arg STRAPI_VERSION="$version" --build-arg NODE_VERSION=24 \
            -t "ghcr.io/rault-a/strapi:$version-alpine" -t "ghcr.io/rault-a/strapi:latest-alpine" \
            images/strapi-alpine
          docker push "ghcr.io/rault-a/strapi:$version-alpine"
          docker push "ghcr.io/rault-a/strapi:latest-alpine"

      - name: Create Release in GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.vars.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ steps.vars.outputs.tag }}" \
            --notes "strapi v${{ steps.vars.outputs.tag }}" || true
