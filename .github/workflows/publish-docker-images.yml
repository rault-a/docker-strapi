name: Publish Docker Image

on:
  push:
    paths:
      - "release-versions/*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [debian, alpine]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the version
        id: vars
        run: echo "tag=$(cat release-versions/strapi-latest.txt)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (${{ matrix.variant }}, ${{ matrix.arch }})
        run: |
          version="${{ steps.vars.outputs.tag }}"
          suffix="${{ matrix.variant == 'alpine' && '-alpine' || '' }}"
          tag="ghcr.io/rault-a/strapi:$version$suffix-${{ matrix.arch }}"
          docker build --build-arg STRAPI_VERSION="$version" --build-arg NODE_VERSION=24 \
            -t "$tag" \
            "images/strapi-${{ matrix.variant }}"
          docker push "$tag"

  publish-manifests:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push multi-arch manifests
        run: |
          version="${{ needs.build.outputs.version }}"
          for suffix in "" "-alpine"; do
            for tag in "$version$suffix" "latest$suffix"; do
              docker buildx imagetools create \
                -t "ghcr.io/rault-a/strapi:$tag" \
                "ghcr.io/rault-a/strapi:$version$suffix-amd64" \
                "ghcr.io/rault-a/strapi:$version$suffix-arm64"
            done
          done

      - name: Create Release in GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.build.outputs.version }}"
          gh release create "v$version" \
            --repo "${{ github.repository }}" \
            --title "Release $version" \
            --notes "strapi v$version" || true
